name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  quality:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Format check
        run: npm run format:check

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build

      - name: Bundle budget
        run: npm run check:bundle

  container:
    name: build container image
    needs: quality
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Publishing needs a registry login; this only builds and smoke-tests the
      # image so a broken Dockerfile never reaches a deploy.
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_APP_URL=${{ vars.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_API_URL=${{ vars.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_RAZORPAY_KEY_ID=${{ vars.NEXT_PUBLIC_RAZORPAY_KEY_ID }}
            NEXT_PUBLIC_SENTRY_DSN=${{ secrets.NEXT_PUBLIC_SENTRY_DSN }}
            NEXT_PUBLIC_SENTRY_ENVIRONMENT=production
            NEXT_PUBLIC_SENTRY_RELEASE=${{ github.sha }}

      - name: Smoke test container
        run: |
          docker run -d --name frontend -p 3000:3000 frontend:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3000/api/health > /dev/null; then
              echo "health check passed after ${i}s"
              break
            fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:3000/api/health
          for path in / /services /book /login; do
            curl -fsS -o /dev/null -w "$path -> %{http_code}\n" "http://127.0.0.1:3000$path"
          done
          # /admin must redirect unauthenticated visitors to the login screen.
          code=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:3000/admin)
          echo "/admin -> $code"
          test "$code" = "307" || test "$code" = "302"
          docker rm -f frontend
