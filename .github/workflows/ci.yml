name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  DJANGO_SETTINGS_MODULE_SHORT: test
  DJANGO_SECRET_KEY: ci-secret-key-not-for-production
  DJANGO_DEBUG: "False"
  DJANGO_DB_NAME: lawyer
  DJANGO_TEST_DB_NAME: lawyer_test
  DJANGO_DB_USER: lawyer_app
  DJANGO_DB_PASSWORD: lawyer_app
  DJANGO_DB_HOST: 127.0.0.1
  DJANGO_DB_PORT: "5432"
  DJANGO_CELERY_TASK_ALWAYS_EAGER: "True"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  quality:
    name: lint + typecheck + migrate-check
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lawyer
          POSTGRES_USER: lawyer_app
          POSTGRES_PASSWORD: lawyer_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lawyer_app -d lawyer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Enable PostgreSQL extensions
        run: psql -h 127.0.0.1 -U lawyer_app -d lawyer -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Ruff lint
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .

      - name: Mypy
        run: mypy apps common config

      - name: No pending migrations
        run: python manage.py makemigrations --check --dry-run

      - name: Django system checks
        run: python manage.py check --deploy --fail-level ERROR --settings=config.settings.dev

  test:
    name: pytest
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lawyer
          POSTGRES_USER: lawyer_app
          POSTGRES_PASSWORD: lawyer_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lawyer_app -d lawyer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Enable PostgreSQL extensions
        run: psql -h 127.0.0.1 -U lawyer_app -d lawyer -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Migrations apply cleanly to a fresh database
        run: |
          python manage.py migrate --noinput
          python manage.py makemigrations --check --dry-run

      - name: Pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: Coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: backend/coverage.xml
          if-no-files-found: error

  frontend:
    name: frontend lint + typecheck + unit + build + lighthouse + e2e
    runs-on: ubuntu-latest
    needs: quality

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: lawyer
          POSTGRES_USER: lawyer_app
          POSTGRES_PASSWORD: lawyer_app
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U lawyer_app -d lawyer"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The end-to-end job drives Django in-process through Playwright's
      # `webServer`, so the database and tenant have to be ready first.
      DJANGO_SETTINGS_MODULE_SHORT: test
      DJANGO_SECRET_KEY: ci-secret-key-not-for-production
      DJANGO_DEBUG: "False"
      DJANGO_DB_NAME: lawyer
      DJANGO_DB_USER: lawyer_app
      DJANGO_DB_PASSWORD: lawyer_app
      DJANGO_DB_HOST: 127.0.0.1
      DJANGO_DB_PORT: "5432"
      DJANGO_CELERY_TASK_ALWAYS_EAGER: "True"
      DJANGO_OTP_SMS_BACKEND: console
      DJANGO_DEFAULT_TENANT_SLUG: demo
      SEED_ADMIN_EMAIL: boss@example.com
      SEED_ADMIN_PASSWORD: e2e-admin-password
      E2E_ADMIN_EMAIL: boss@example.com
      E2E_ADMIN_PASSWORD: e2e-admin-password
      E2E_BACKEND_LOG: /tmp/backend-e2e.log
      # The Playwright config starts Django itself; CI has no repo virtualenv.
      E2E_PYTHON: python

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Install backend dependencies for the e2e stack
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install ".[dev]"

      - name: Enable PostgreSQL extensions
        run: psql -h 127.0.0.1 -U lawyer_app -d lawyer -c "CREATE EXTENSION IF NOT EXISTS btree_gist;"

      - name: Migrate and seed
        working-directory: backend
        run: |
          python manage.py migrate --noinput
          python scripts/seed_demo.py

      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: Typecheck
        working-directory: frontend
        run: npm run typecheck

      - name: Unit tests
        working-directory: frontend
        run: npm run test

      - name: Build
        working-directory: frontend
        run: npm run build
        env:
          # Lighthouse below audits the bundle against the same proxy the e2e
          # suite uses, so both must be built for one API origin.
          NEXT_PUBLIC_API_URL: http://localhost:3399/api/v1
          API_URL: http://localhost:3399/api/v1

      - name: Bundle budget
        working-directory: frontend
        run: npm run check:bundle

      - name: Install Playwright Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      # Lighthouse needs a Chrome it can attach to, and `chrome-launcher` will
      # not look inside Playwright's browser cache. Resolve the pinned Chromium
      # once and share it with both the Lighthouse and e2e steps.
      - name: Resolve Chromium path
        working-directory: frontend
        run: |
          echo "CHROME_PATH=$(node -p 'require("@playwright/test").chromium.executablePath()')" >> "$GITHUB_ENV"

      # Lighthouse audits the production bundle with Playwright's pinned
      # Chromium, so a local run and this run score the same engine. Both
      # profiles gate: this is a site people book appointments on, so a
      # desktop-only gate would let a slow mobile LCP ship.
      #
      # The audited pages read live data (the booking wizard lists services and
      # prices, the landing page reads CMS content), so Django and the API proxy
      # must be running or the audit measures error states instead of the pages
      # users actually get.
      - name: Start API stack for Lighthouse
        working-directory: backend
        run: |
          nohup python manage.py runserver 8000 --noreload > /tmp/backend-lh.log 2>&1 &
          echo $! > /tmp/backend-lh.pid

      - name: Start API proxy for Lighthouse
        working-directory: frontend
        run: |
          nohup env TEST_PROXY_PORT=3399 \
            TEST_PROXY_ALLOWED_ORIGIN=http://localhost:3398 \
            node scripts/test-api-proxy.mjs > /tmp/proxy-lh.log 2>&1 &
          echo $! > /tmp/proxy-lh.pid

      - name: Wait for API stack
        working-directory: frontend
        run: |
          for i in $(seq 1 60); do
            if curl -fsS "http://localhost:8000/api/v1/services/?status=active" > /dev/null 2>&1; then
              echo "API stack ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "API stack never became ready"; tail -20 /tmp/backend-lh.log; exit 1

      - name: Lighthouse gate (desktop)
        working-directory: frontend
        run: npm run check:lighthouse
        env:
          LIGHTHOUSE_FORM_FACTOR: desktop
          API_URL: http://localhost:3399/api/v1

      - name: Lighthouse gate (mobile)
        working-directory: frontend
        run: npm run check:lighthouse
        env:
          LIGHTHOUSE_FORM_FACTOR: mobile
          API_URL: http://localhost:3399/api/v1

      - name: Stop API stack
        if: always()
        run: |
          [ -f /tmp/backend-lh.pid ] && kill "$(cat /tmp/backend-lh.pid)" 2>/dev/null || true
          [ -f /tmp/proxy-lh.pid ] && kill "$(cat /tmp/proxy-lh.pid)" 2>/dev/null || true

      - name: End-to-end
        working-directory: frontend
        run: npm run test:e2e
        env:
          CI: "true"

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7
          if-no-files-found: ignore
