[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lawyer-backend"
version = "0.1.0"
description = "Multi-tenant-ready appointment booking and management backend"
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django==5.2.17",
    "djangorestframework==3.18.1",
    "djangorestframework-simplejwt==5.5.1",
    "drf-spectacular==0.30.0",
    "django-filter==26.1",
    "django-celery-beat==2.9.0",
    "django-environ==0.14.0",
    "django-storages==1.14.6",
    "django-cors-headers==4.9.0",
    "whitenoise==6.12.0",
    "celery[redis]==5.6.3",
    "psycopg[binary,pool]==3.3.6",
    "structlog==26.1.0",
    "argon2-cffi==25.1.0",
    "gunicorn==26.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-django==4.14.0",
    "pytest-cov==7.1.0",
    "factory-boy==3.3.3",
    "freezegun==1.5.5",
    "fakeredis==2.38.0",
    "ruff==0.16.9",
    "mypy==2.3.1",
    "django-stubs==6.1.1",
    "djangorestframework-stubs==3.18.1",
]

[tool.setuptools]
# The application runs from the source tree (the container's WORKDIR is /app);
# this distribution exists only to declare and install dependencies. Without
# an explicit empty list, setuptools' flat-layout auto-discovery aborts on the
# several top-level packages (apps, common, config).
packages = []

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["*/migrations/*", ".venv"]
lint.select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "N",   # pep8-naming
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "DJ",  # flake8-django
    "RUF", # ruff-specific
]
lint.ignore = [
    "RUF001",  # ambiguous unicode in strings
    "RUF002",  # ambiguous unicode in docstrings
    "RUF003",  # ambiguous unicode in comments
    "B008",    # function call in default arg - required by DRF APIView patterns
]
lint.per-file-ignores = { "tests/**" = ["E501", "N802", "N806", "DJ008"], "config/settings/*.py" = ["F403", "F405"], "*/migrations/*" = ["E501"] }

[tool.ruff.lint.isort]
known-first-party = ["apps", "common", "config"]

[tool.mypy]
python_version = "3.12"
plugins = ["mypy_django_plugin.main", "mypy_drf_plugin.main"]
strict = true
warn_unreachable = true
show_error_codes = true
exclude = ["\\.venv/", "migrations/"]
mypy_path = "."

# Task modules: Celery's `@app.task` decorator carries no type information, so
# annotating the function under it is impossible to type-check cleanly. The
# task bodies themselves stay strictly typed.
[[tool.mypy.overrides]]
module = ["apps.*.tasks"]
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = ["tests.*", "scripts.*", "config.celery", "config.wsgi", "config.asgi"]
disallow_untyped_defs = false
disallow_untyped_calls = false
disallow_subclassing_any = false
disallow_untyped_decorators = false
check_untyped_defs = true
disable_error_code = ["no-untyped-def", "no-any-return"]

[[tool.mypy.overrides]]
module = [
    "environ.*",
    "celery.*",
    "django_celery_beat.*",
    "fakeredis.*",
    "freezegun.*",
    "factory.*",
    "drf_spectacular.*",
    "rest_framework_simplejwt.*",
    "storages.*",
]
ignore_missing_imports = true

[tool.django-stubs]
django_settings_module = "config.settings.test"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py", "tests.py"]
addopts = [
    "--strict-markers",
    "--strict-config",
    "-ra",
]
testpaths = ["tests"]
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that hit the database or the API layer",
    "e2e: full-flow tests across apps",
    "celery: tests that require the Celery app",
    "concurrency: multi-threaded / multi-transaction tests",
]
filterwarnings = [
    "ignore::DeprecationWarning:django_celery_beat.*",
    "ignore::PendingDeprecationWarning",
]

[tool.coverage.run]
branch = true
source = ["apps", "common", "config"]
omit = ["*/migrations/*", "*/tests/*", "manage.py", "config/wsgi.py", "config/asgi.py"]

[tool.coverage.report]
show_missing = true
skip_covered = false
fail_under = 0

[tool.coverage.html]
directory = "htmlcov"
